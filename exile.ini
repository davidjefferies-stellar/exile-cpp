; exile.ini — startup configuration loaded by Game::init.
;
; Format: [section] headers, key = value lines.
; Comments start with ; or # and run to end of line.
; Numbers can be decimal (42) or hex (0x2a).
;
; Missing keys / sections fall back to the hard-coded defaults that
; reproduce the original game's spawn state. Delete this file to get
; the defaults; rename to e.g. exile.dev.ini and copy to enable.

[player]
; Starting tile position (0..255 each axis). World wraps every 256
; tiles; the original spawn is 0x9B, 0x3B (the upper-world surface).
start_x = 0x9B
start_y = 0x3B

; Debug locations - uncomment to use
;start_x = 143  ; main cavern
;start_y = 116
;start_x = 166   ; surface
;start_y = 78
;start_x = 163 ; near hovering robot just past the piano
;start_y = 91
;start_x = 180 ; top of windy tunnel	
;start_y = 102
;start_x = 155	; main cavern near homing robot
;start_y = 106
;start_x = 159   ; between the transporters near the protection_suit
;start_y = 88
;start_x = 121  ; quiet cave beneath main cavern
;start_y = 116
;start_x = 217  ; near big block
;start_y = 128
;start_x = 231  ; near red frogman
;start_y = 152

;start_x = 171	; near engine 
;start_y = 99

; PerfTest Setup
;start_x = 159
;start_y = 89

; Starting suit energy (0..255). 0xff = full. 
energy = 0xff
 
; Selected weapon slot. Names accepted: jetpack, pistol, icer, blaster,
; plasma (or plasma_gun), suit (or protection_suit). Numeric 0..5 also
; works.
weapon = pistol

; player wears the protection suit from the first frame.
give_protection_suit = false

; Player invincibility — when true, energy is reset to 0xff at the top of
; every tick, undoing any damage taken during the frame. Useful for
; level-walking and AI testing. Default false.
invincible = false

; Path to a BBC-format save (1024 bytes, XOR-streamed) to load at startup
; after the landscape bake. Overrides the [player] start_*, [weapon_energy],
; [pockets] and [keys] starting state with the contents of the save. Extract
; these from .ssd disks via tools/extract_ssd_saves.py — the .sav files
; under save_disks/extracted/ are ready to drop in here.
; Empty / commented out = no BBC save load.
;bbc_save = save_disks/extracted/Exile_Saves_12_to_19/19.sav

[weapon_energy]
; Initial ammo per weapon slot (16-bit, 0..65535). The icer costs 0x10
; per shot, so 0x0800 = ~128 shots.
jetpack = 0x0800
pistol  = 0x1000
icer    = 0x0800
blaster = 0x0000
plasma  = 0x0000
suit    = 0

[caches]
; How many primary / secondary slots the world can use at once. Both are
; clamped at load time to the compile-time ceilings in core/types.h
; (PRIMARY_OBJECT_SLOTS = 64, SECONDARY_OBJECT_SLOTS = 128). Defaults
; reproduce the 6502 ROM (16 / 32). Raising these lets more primaries be
; simultaneously active around the player — useful for wider viewports
; where the BBC's 15 non-player primaries run out before every visible
; tile's tertiary has a chance to spawn.
;
;   primary_slots   : includes slot 0 (the player), so 16 = player + 15
;                     simultaneous other primaries. Each slot is ~22
;                     bytes; raising to 64 costs ~1 KB.
;   secondary_slots : offscreen-but-remembered objects. 4 bytes each,
;                     so doubling costs ~128 bytes.

;primary_slots   = 16
;secondary_slots = 32
primary_slots   = 128
secondary_slots = 128

[distances]
; Activation-ring radii (in tiles). Two collapsed keys:
;   radius_static : controls demote_tertiary + demote_settled +
;                   promote_secondary + spawn_tertiary. Tying them
;                   together avoids the spawn/demote oscillation the
;                   port's wider viewport causes when these diverge.
;   radius_moving : primary -> (secondary | tertiary) radius for
;                   moving / airborne objects (KEEP_AS_PRIMARY_FOR_
;                   LONGER). Independent so flying / thrown stuff can
;                   stay live further out than static fixtures.
;
; Defaults below are the 6502 ROM values (4 / 12). Uncomment the
; exile-cpp block to widen the primary-cache activation zone to roughly
; 4x the ROM area — useful when the port's viewport is much wider than
; the BBC's 8 tiles, so things stay live as the player scrolls past.

; Exile-cpp (wider-viewport defaults). HARD CAP: both values must be
; < 128. is_far_from_anchor in object_manager.cpp casts the dx/dy
; difference to int8_t (signed 8-bit, range [-128, +127]), so any
; distance >= 128 makes the "is far" predicate always false and
; check_demotion stops demoting altogether — primary pool fills up.
radius_static = 32
radius_moving = 64

; Original (6502 ROM):
;radius_static = 4
;radius_moving = 12

[landscape]
; Pick which procedural landscape generator runs.
;   false : pseudo-6502 reference (landscape.cpp). Tracks A/C through an
;           Alu struct; matches the 6502 disassembly line-for-line.
;   true  : native C++ rewrite (landscape_cpp.cpp). Same algorithm,
;           expressed with implicit uint8_t wraparound and explicit
;           carry only where consumed.
;
; The two paths are intended to produce byte-identical maps; the toggle
; exists so the rewrite can be A/B-tested against the reference. Default
; false (the reference).
use_cpp_impl = false

[creatures]
; Re-type the PIPE tertiary at (198, 190) from BLUE_CYAN_IMP (the
; original 6502 spawner) to CRAB so the EXILE1 pre-release sprite is
; visible in-game. Set false to restore the imp spawn.
pipe_198_190_crab = false

; Pre-place Triax at (&99, &3b) in slot 1 (port of the 6502 &0860
; initial object table). On true (default), the frame-1 update_triax
; plays the absorb + teleport intro because Triax is adjacent to the
; destinator tertiary. Set false to start without Triax in the world
; so the upper world can be explored without the intro grab.
spawn_initial_triax = true

; Sucking-nest damage on touch covers the player. 
sucking_nest_damages_player = true

[render]
; subpixel_rendering — controls how sub-tile fractions are rendered.
; Three modes:
;   off      : always snap each fraction to the BBC's pixel grid
;              (16 frac per X-pixel, 8 frac per Y-row). The 6502
;              worked this way; gravity / tile-collision oscillation
;              on grounded objects is invisible. Motion looks chunky
;              at high zoom because positions step in whole pixels.
;   on       : never snap — every fraction unit advances the screen
;              position. Motion is silky-smooth but the 6502's
;              gravity-vs-tile-collision oscillation surfaces as 1-2
;              px judder on every grounded object.
;   adaptive : per-object — snap only when the object is fully
;              stationary (|vx| < 1 && |vy| < 1). Any motion renders
;              at sub-pixel precision. The camera follows the same
;              rule against the player's velocity. Net effect:
;              completely-stopped objects don't judder; anything in
;              motion (including the 1-frame gravity tick) is smooth.
;              Default.
subpixel_rendering = adaptive

; Initial zoom denominator. On-screen zoom = scale / zoom_den, where scale
; defaults to 3, so zoom_den = 1 is the stock 3:1 view. Higher values zoom
; OUT (more tiles on screen) — useful for map-mode panning to scout a
; location to use as [player] start_x/start_y. Clamped to the renderer's
; max (5). The mouse wheel still adjusts zoom at runtime from here.
zoom_den = 1

; PerfTest Setup
;zoom_den = 7

[audio]
; Master enable for the synthesised sound. When false, every Audio::play
; / play_at call becomes a silent no-op — the device still opens so
; this is just a flag flip. Defaults to true (on); set to false for a
; quiet testing session. Accepted values: true/false, yes/no, on/off, 1/0.
enabled = true

[logs]
; Master switch for both diagnostic log files (exile-debug.log and
; exile-audio.log). When false the files are never opened, so every
; logging call site becomes a silent no-op.
;
; Default depends on build:
;   Debug   : true  (logs always on for in-development debugging)
;   Release : false (no log files written for end-user runs)
;
; This line, if present and set to true/false, overrides the build
; default — flip it on in a Release build to capture a log for a bug
; report. Accepted values: true/false, yes/no, on/off, 1/0.
enabled = true

[debug]
; Stress-test mode — when true, scatter one of every animated creature
; type (~40 NPCs) in a grid NW of the player's spawn at startup. Used
; to benchmark the AI dispatch / primary-slot pool / rendering with a
; full primary cache. Defaults to false. Accepted values: true/false,
; yes/no, on/off, 1/0.
stress_test = false

; Grenade chain-reaction test rig. When true, drops one ACTIVE_GRENADE
; and four INACTIVE_GRENADEs on door (80, 95); tick_test_grenades flips
; the inactives mid-fuse so all four detonate in a chain ~48 frames
; after the seed. Off by default.
grenade_chain = false

; Icer-drop test rig. When true, drops seven ICER_BULLETs falling at
; vy=0x30 onto (80, 80) for bullet-vs-tile collision tuning. Off by
; default.
icer_drop = false

; Jetpack boost-tint. When true, jetpack thrust particles flip from
; their cycling stock palette to a red/magenta combo while the booster
; (Right Ctrl / [) is held, so the 2x acceleration path is visible at
; a glance. Off by default.
jetpack_boost_tint = false

; When true, J pushes only the player's (x, y) to jsbeeb instead of the
; full world-state snapshot. Useful while tracking down per-object
; divergences between the port and the BBC. Default false.
jsbeeb_position_only = false

; Frame profiler. Requires [logs] enabled = true to see output. The
; timing has near-zero cost when off. 
profile = false

; Top-right FPS readout — measured over a 30-frame rolling window
show_fps = true

; Suppress every NPC bullet/projectile spawn. Useful for isolating
; player-bullet behaviour in collision / damage testing. NPCs still
; move, animate and damage on contact — only their projectile spawns
; are gated. Default true (NPCs fire normally).
npc_firing_enabled = true

; Game tick rate. The BBC original ran at 25 Hz;
target_fps = 25

[whistles]
; Whistle collected flags (ports of &0816 player_whistle_one_collected
; and &0817 player_whistle_two_collected). 
whistle_one_collected = true
whistle_two_collected = true

[keys]
; Port of &0806 player_keys_collected. Each key marks a bit in the
; player's key-collected bitmask; doors read that bitmask 
; when hit by the RCD. 
;
cyan_yellow_green_key = false
red_yellow_green_key  = false
green_yellow_red_key  = false
yellow_white_red_key  = false
red_magenta_red_key   = false
blue_cyan_green_key   = false

[pockets]
; Up to 5 pocket slots. slot0 is the top of the stack — pressing R
; pulls slot0 out as the held object.
;
; Values are object-type names (matching ObjectType enum spellings) or
; raw numbers. Useful pickups:
;   icer, pistol, blaster, plasma_gun, protection_suit,
;   power_pod, coronium_crystal, fluffy, mushroom_immunity_pill,
;   whistle_one, whistle_two, fire_immunity_device,
;   radiation_immunity_pill, alien_weapon, blue_mushroom_ball,
;   red_mushroom_ball, active_grenade, remote_control_device,
;   cannon_control_device.

; Slots above the first empty one are ignored — the stack is contiguous.

slot0 = remote_control_device
slot1 = inactive_grenade
slot2 = inactive_grenade
;slot3 = 
;slot4 = 


[startup_spawns]
; Drop primary objects into the world during Game::init (after the
; landscape bake, before the main loop starts). Each entry is one
; primary create_object call; use this for testing specific creatures
; or pickups in specific tiles without authoring a tertiary entry.
;
; Format:
;   <key> = <type>, <tile_x>, <tile_y>[, <x_frac>][, <y_frac>]
;
;   key      : any unique identifier inside this section. slot0..slotN
;              works; any name does as long as no two entries share it.
;   type     : ObjectType name (case-insensitive — power_pod, alien_weapon,
;              red_magenta_imp, wasp, etc.) or numeric (decimal / 0xNN).
;   tile_x/y : 0..255 world tile coordinates.
;   x_frac   : optional 0..255 sub-tile fraction. Default 0x80 (centred).
;   y_frac   : optional 0..255 sub-tile fraction. Default 0x80 (centred).
;
; Examples (commented out — uncomment to test):
;
;slot0 = power_pod, 198, 188
;slot1 = alien_weapon, 204, 192
;slot2 = wasp, 203, 191
;slot3 = dog, 141, 129
;
; Slots that fail to spawn (unknown type, full primary pool) are
; skipped silently — check the lifecycle log for cre p<slot> events
; to confirm each entry took.
