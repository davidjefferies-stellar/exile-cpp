name: tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual trigger so we can rerun without a code push.
  workflow_dispatch:

jobs:
  build-and-test-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # The committed .vcxproj has <OutDir>D:\Projects\Exile\</OutDir>
      # which is the maintainer's local path. Override it on the
      # command line so MSBuild drops the exe inside the checkout
      # instead — the runner has no D: drive. /p:OutDir keeps the
      # repo source untouched (no .vcxproj edits needed).
      #
      # Platform=x64 must match the only configuration the .vcxproj
      # defines; without it MSBuild picks "Win32" and errors out.
      - name: Build exile_tests
        run: >
          msbuild exile_tests.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:OutDir=${{ github.workspace }}\build\bin\

      # Run from the repo root so the exe finds exile.ini, data/, and
      # resources/ via their relative paths. The test binary's main()
      # returns the failure count → non-zero exit fails the job, which
      # is exactly what GitHub Actions wants. shell: cmd avoids pwsh's
      # native-stdout capture quirk that was hiding [ RUN ]/[ FAIL ]
      # lines from the action log.
      - name: Run tests
        shell: cmd
        run: ${{ github.workspace }}\build\bin\exile_tests.exe
        working-directory: ${{ github.workspace }}

  build-and-test-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Run tests
        run: ./build/exile_tests
