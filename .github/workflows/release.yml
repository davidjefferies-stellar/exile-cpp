name: release

on:
  push:
    tags: ['v*']
  # Manual trigger for testing the build without cutting a real release.
  workflow_dispatch:

permissions:
  contents: write   # softprops/action-gh-release needs this to upload assets.

jobs:
  build-and-release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      # Same OutDir override as tests.yml — the committed .vcxproj uses
      # a maintainer-local D:\ path. Direct the build into the checkout.
      - name: Build exile (Release|x64)
        run: >
          msbuild exile.vcxproj
          /p:Configuration=Release
          /p:Platform=x64
          /p:OutDir=${{ github.workspace }}\build\bin\

      # Stage the runtime bundle: the exe + the default exile.ini. The
      # landscape is procedurally baked when exile.map is missing, so we
      # don't ship a map file.
      - name: Stage release bundle
        shell: pwsh
        run: |
          $stage = "${{ github.workspace }}\stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "${{ github.workspace }}\build\bin\exile.exe" $stage
          Copy-Item "${{ github.workspace }}\exile.ini" $stage
          # Ship the save disks so players can load them (game scans save_disks/ at runtime).
          Copy-Item "${{ github.workspace }}\save_disks" $stage -Recurse

      - name: Zip the bundle
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $zip = "${{ github.workspace }}\exile-$tag-win64.zip"
          Compress-Archive -Path "${{ github.workspace }}\stage\*" `
                           -DestinationPath $zip
          # Surface the resolved path to subsequent steps.
          "ASSET=$zip" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      # Create the GitHub Release and attach the zip. Release notes
      # default to the auto-generated changelog from the previous tag;
      # `generate_release_notes: true` triggers GitHub's own diff text.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-and-release-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            libx11-dev libxi-dev libxcursor-dev libgl1-mesa-dev libasound2-dev

      - name: Build exile (Release)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target exile -j

      - name: Stage release bundle
        run: |
          mkdir -p stage
          cp build/exile stage/
          cp exile.ini stage/
          # Ship the save disks so players can load them (game scans save_disks/ at runtime).
          cp -r save_disks stage/

      # tar.gz, not zip, to keep the executable bit.
      - name: Tar the bundle
        run: |
          TAG="${{ github.ref_name }}"
          tar -czf "exile-${TAG}-linux-x64.tar.gz" -C stage .
          echo "ASSET=exile-${TAG}-linux-x64.tar.gz" >> "$GITHUB_ENV"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ env.ASSET }}
          generate_release_notes: true
          draft: false
          prerelease: false
